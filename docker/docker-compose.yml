services:
  db:
    image: "postgres:13.0"
    restart: always
    environment:
      POSTGRES_DB: "judge0"
      POSTGRES_USER: "judge0"
      POSTGRES_PASSWORD: "judge0password"
    volumes:
      - judge0-postgres-data:/var/lib/postgresql/data

  redis:
    image: "redis:6.0"
    restart: always
    command:
      - bash
      - -c
      - redis-server --appendonly yes --requirepass judge0password
    volumes:
      - judge0-redis-data:/data

  judge0:
    image: "judge0/judge0:1.13.0"
    restart: always
    privileged: true
    command:
      - ./scripts/server
    ports:
      - "2358:2358"
    environment:
      REDIS_HOST: "redis"
      REDIS_PORT: "6379"
      REDIS_PASSWORD: "judge0password"
      POSTGRES_HOST: "db"
      POSTGRES_PORT: "5432"
      POSTGRES_DB: "judge0"
      POSTGRES_USER: "judge0"
      POSTGRES_PASSWORD: "judge0password"
    depends_on:
      - db
      - redis

  worker:
    image: "judge0/judge0:1.13.0"
    restart: always
    privileged: true
    command:
      - ./scripts/workers
    environment:
      REDIS_HOST: "redis"
      REDIS_PORT: "6379"
      REDIS_PASSWORD: "judge0password"
      POSTGRES_HOST: "db"
      POSTGRES_PORT: "5432"
      POSTGRES_DB: "judge0"
      POSTGRES_USER: "judge0"
      POSTGRES_PASSWORD: "judge0password"
    depends_on:
      - db
      - redis

volumes:
  judge0-postgres-data:
  judge0-redis-data: